
html<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>
    <link rel="stylesheet" href="Map.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

</head>
<body>
<input type="file" id="excelFile" accept=".xlsx,.xls">

<br><br>


<label>Location Column:</label>
<select id="locationColumn"></select>
    
<label>Date Column:</label>
<select id="dateColumn"></select>

<label>Time Column:</label>
<select id="timeColumn"></select>

<label>Tower ID:</label>
<select id="towerColumn"></select>

<br><br>
<label>From Date:</label>
<input type="date" id="fromDate">

<label>To Date:</label>
<input type="date" id="toDate">

<label>From Time:</label>
<input type="time" id="fromTime">

<label>To Time:</label>
<input type="time" id="toTime">
 <br><br>   
<button id="generateMap">Generate Map</button>

<hr>

<h3>Suspect Movement Map</h3>
<div id="map"></div>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
 <script src="https://unpkg.com/leaflet-polylinedecorator/dist/leaflet.polylineDecorator.min.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="Map.js"></script>
</body>
</html>
